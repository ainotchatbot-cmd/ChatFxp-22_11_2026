services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatfxp
      POSTGRES_USER: chatfxp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    volumes:
      - chatfxp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatfxp -d chatfxp"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: ${APP_URL:-http://localhost:3000}
      SQL_HOST: db
      SQL_PORT: 5432
      SQL_USER: chatfxp
      SQL_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
      SQL_DB_NAME: chatfxp
      SUPER_ADMIN_EMAILS: ${SUPER_ADMIN_EMAILS:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  chatfxp_pgdata:
