name: Deploy ChatFXP to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e23e01ea5a995a732c3114d712f34a42
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Normalize Cloudflare token format
        shell: bash
        run: |
          token="${RAW_CLOUDFLARE_API_TOKEN}"
          token="${token#Bearer }"
          token="${token#bearer }"
          token="$(printf '%s' "$token" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [ -z "$token" ]; then
            echo "::error::CF_API_TOKEN secret is empty."
            exit 1
          fi
          echo "::add-mask::$token"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Build frontend
        run: npm run build
      - name: Verify Cloudflare Worker configuration
        run: npx wrangler@4 deploy --dry-run --config wrangler.jsonc
      - name: Deploy ChatFXP Worker and assets
        run: npx wrangler@4 deploy --config wrangler.jsonc
      - name: Verify D1 production database
        run: npx wrangler@4 d1 info chatfxp-production --json
