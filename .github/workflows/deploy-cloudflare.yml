name: Deploy ChatFXP to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        # The repo currently has no npm lockfile and Vite 8's esbuild peer
        # range conflicts with the esbuild version pinned for Drizzle Kit.
        # Legacy peer resolution is used only for this install; the build
        # remains the validation gate below.
        run: npm install --legacy-peer-deps
      - name: Build frontend
        run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatfxp-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Deploy to Cloudflare
        if: ${{ env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != '' }}
        run: |
          npx wrangler@4 d1 execute chatfxp-production --remote --file=drizzle/d1_full_schema.sql
          npx wrangler@4 deploy --config wrangler.jsonc
      - name: Deployment credentials not configured
        if: ${{ env.CF_API_TOKEN == '' || env.CF_ACCOUNT_ID == '' }}
        run: echo "::notice::Build passed. Deployment skipped until CF_API_TOKEN and CF_ACCOUNT_ID are added as GitHub repository secrets."
